# =============================================================================
# Price catalog — YouTube Agent (Budget Guard)
# =============================================================================
# Prices are DATA, never code (roadmap Part 10 / section 35, Leak 11).
# Every estimate and ledger entry snapshots the catalog row it used, so a
# historical video's cost never changes retroactively when prices move.
#
# All figures verified 2026-10-22 (roadmap price base). unit_price_usd is the
# price of ONE unit of `unit`:
#   input_token / output_token / cached_input_token -> USD per single token
#       (e.g. $0.10 per 1M input tokens = 0.0000001 per token)
#   tts_char  -> USD per character (a 10-min video is ~9,000 chars)
#   image     -> USD per generated image
#
# BILLING ROUTE MATTERS: `billing_route` records HOW the user actually pays.
#   api_payg             pay-as-you-go API pricing
#   subscription_credits subscription credit pool (e.g. ElevenLabs UI plans)
#   free / local         $0 marginal cost routes
# NOTE: ElevenLabs subscription credits cost ~$1.49-1.80 per 10-min video
# (Creator $22/mo = 121k credits; Pro $99/mo = 600k credits) — roughly 2-4x
# the API price for the SAME characters. The engine must price the user's
# ACTUAL billing route, never a generic "ElevenLabs price".
#
# PRICE-DRIFT WARNINGS (announced changes — re-verify the catalog):
#   * Gemini 3.8 Flash intro pricing DOUBLES on 2027-01-01
#     ($0.75/$3.75 -> $1.50/$7.50 per 1M tokens).
#   * OpenAI tts-1 / gpt-4o-mini-tts shutdown reported for 2027-01-06, with a
#     differently-priced replacement — TTS estimates must be re-priced then.
#   * Any entry whose verified_at is >60 days old is STALE
#     (PriceCatalog.is_stale()) and estimates must warn before use.
# =============================================================================
