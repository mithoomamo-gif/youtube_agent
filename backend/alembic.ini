# Alembic configuration for the YouTube Agent backend.
# The real database URL is resolved in migrations/env.py from the
# YTA_DATA_DIR environment variable or app.db.default_db_path();
# sqlalchemy.url below is only a placeholder for offline tooling.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./yta_dev_placeholder.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
