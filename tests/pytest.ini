[pytest]
; =============================================================================
; YouTube Agent — pytest configuration
;
; Location note: this file deliberately lives in tests/ (not the repo root).
; Pytest finds it when the suite is invoked as `pytest tests/` (or `pytest .`
; from inside tests/) and treats tests/ as the rootdir. A future repo-root
; pyproject.toml / pytest.ini owned by the backend team should copy these
; settings verbatim (adjusting testpaths to `tests`) rather than diverge.
;
; This config must work with ONLY pytest installed. Optional plugins
; (pytest-asyncio, pytest-cov, ...) are documented in tests/README.md and
; must never become a collection-time hard dependency.
; =============================================================================

; Relative to rootdir (= this tests/ directory).
testpaths = .

; -ra            summary of all non-passing outcomes (skips included)
; --strict-markers  typo'd / unregistered markers are errors, not warnings
; -m "not live"  live tests (real provider keys / network) are excluded by
;                default; opt in explicitly with `pytest tests/ -m live`
;                (an explicit -m on the command line overrides this one)
addopts = -ra --strict-markers -m "not live"

markers =
    unit: L1 unit tests — pure, hermetic, fast; run on every PR.
    contract: L1/L2/L9 contract tests — API shapes, provider-adapter and security contracts.
    integration: L4 pipeline integration tests — hermetic DAG runs with faked providers.
    ffmpeg: requires a local ffmpeg (and usually ffprobe) binary; auto-skipped when absent.
    live: needs real provider API keys and network access; excluded by default, run only on demand / weekly sandbox smoke.
    golden: L3/L5 golden-dataset evals and golden-video regression; statistical thresholds, not exact matches.
    slow: slow tests (soak, long renders, full nightly fixtures); deselect with -m "not slow" for a quick loop.

; Keep the default warning summary readable; real errors still surface.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*

; --- pytest-asyncio (OPTIONAL, not required for collection) -----------------
; If pytest-asyncio is installed, async tests should use asyncio_mode = auto.
; The setting is intentionally NOT active here: naming an unknown ini key is
; harmless, but an active `asyncio_mode` line without the plugin installed
; produces a config warning on every run. When the backend team adds
; pytest-asyncio to the dev requirements, uncomment the line below (or move
; this whole config to the repo root) — see tests/README.md.
;asyncio_mode = auto
